name: dagi_app
description: "Dagi App Fitness & Nutrition Tracking App"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  image_picker: ^1.2.3
  http: ^1.6.0
  fl_chart: ^1.2.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#07101B"
  adaptive_icon_foreground: "assets/app_icon.png"

flutter_native_splash:
  color: "#07101B"
  image: "assets/app_icon.png"
  android_12:
    image: "assets/app_icon.png"
    color: "#07101B"
  ios: true
  android: true

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/data/
